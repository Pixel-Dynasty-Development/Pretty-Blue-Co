<section class="bg-bg-page py-24 dark:bg-bg-page-dark">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-16 text-center">
      <h1
        class="mb-4 text-4xl font-extrabold text-text-default md:text-5xl dark:text-text-default-dark"
      >
        Start Your Order
      </h1>
      <p
        class="mx-auto max-w-2xl text-lg text-text-secondary dark:text-text-secondary-dark"
      >
        Tell us about your custom apparel needs. We’ll get back to you with a
        quote and a design proof shortly!
      </p>
    </div>

    <div class="grid grid-cols-1 gap-12 lg:grid-cols-3">
      <div
        class="border-default rounded-3xl border bg-white p-8 shadow-2xl lg:col-span-2 dark:border-border-dark dark:bg-gray-900"
      >
        <form action="#" method="POST" class="space-y-6">
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <div>
              <label
                class="mb-2 block text-sm font-bold text-text-default dark:text-text-default-dark"
                >Name</label
              >
              <input
                type="text"
                required
                class="w-full rounded-xl border border-gray-300 bg-transparent px-4 py-3 dark:border-gray-700"
                placeholder="Jane Doe"
              />
            </div>
            <div>
              <label
                class="mb-2 block text-sm font-bold text-text-default dark:text-text-default-dark"
                >Email</label
              >
              <input
                type="email"
                required
                class="w-full rounded-xl border border-gray-300 bg-transparent px-4 py-3 dark:border-gray-700"
                placeholder="jane@example.com"
              />
            </div>
          </div>

          <div>
            <label
              class="mb-2 block text-sm font-bold text-text-default dark:text-text-default-dark"
              >Order Type</label
            >
            <select
              required
              class="w-full rounded-xl border border-gray-300 bg-transparent px-4 py-3 dark:border-gray-700 dark:text-white"
            >
              <option value="">What are we making?</option>
              <option value="business">Business Branding (Bulk)</option>
              <option value="personal">Personal Custom Shirt/Gift</option>
              <option value="event">Event Apparel (Family/Club)</option>
              <option value="other">Other Inquiry</option>
            </select>
          </div>

          <div>
            <label
              class="mb-2 block text-sm font-bold text-text-default dark:text-text-default-dark"
              >Tell us your idea</label
            >
            <textarea
              rows="5"
              required
              class="w-full rounded-xl border border-gray-300 bg-transparent px-4 py-3 dark:border-gray-700"
              placeholder="Describe the item, quantity, and design you're looking for..."
            ></textarea>
          </div>

          <button
            type="submit"
            class="w-full rounded-xl bg-primary px-8 py-4 text-lg font-bold text-white shadow-lg transition hover:scale-[1.02] dark:bg-primary-dark"
          >
            Send Inquiry
          </button>
        </form>
      </div>

      <div class="space-y-8">
        <div
          class="rounded-3xl border border-primary/20 bg-bg-surface p-8 dark:bg-bg-surface-dark"
        >
          <h2
            class="mb-6 text-2xl font-bold text-text-default dark:text-text-default-dark"
          >
            Direct Contact
          </h2>
          <div class="space-y-4">
            <div>
              <p class="text-sm font-bold text-primary uppercase">Email Us</p>
              <a
                href="mailto:{{contactEmail}}"
                class="text-lg transition hover:text-secondary"
                >{{contactEmail}}</a
              >
            </div>
            <div>
              <p class="text-sm font-bold text-primary uppercase">Call Us</p>
              <a
                href="tel:{{contactPhone}}"
                class="text-lg transition hover:text-secondary"
                >{{contactPhone}}</a
              >
            </div>
          </div>
        </div>

        <div class="rounded-3xl bg-secondary p-8 text-white shadow-xl">
          <h3 class="mb-2 text-xl font-bold">Fast Response!</h3>
          <p>We typically respond to all apparel inquiries within 24 hours.</p>
        </div>
      </div>
    </div>
  </div>
</section>
